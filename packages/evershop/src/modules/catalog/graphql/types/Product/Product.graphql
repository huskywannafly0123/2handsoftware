"""
Represents a product.
"""
type Product {
  productId: Int!
  uuid: String!
  name: String!
  status: Int!
  sku: String!
  weight: Weight!
  taxClass: Int
  description: JSON
  urlKey: String
  metaTitle: String
  metaDescription: String
  metaKeywords: String
  variantGroupId: ID
  visibility: Int
  groupId: ID
  url: String
  productType: String
  vendorId: ID
  vendor: AdminUser
}

"""
Returns a collection of products.
"""
type ProductCollection {
  items: [Product]
  currentPage: Int!
  total: Int!
  currentFilters: [Filter]
}

type AdminUser {
  userId: ID
  fullName: String
  email: String
  role: String
}

extend type Query {
  product(id: ID): Product
  products(filters: [FilterInput]): ProductCollection
}
